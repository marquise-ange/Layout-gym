<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Gym</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-8">
     <h1 class="text-3xl font-bold text-center mb-8">
        Layout Gym
    </h1>

        
    <!-- Exercise 1 -->
    <section>
        <h2 class="text-2xl font-bold mb-6">
            Exercise 1-Nine Positions
        </h2>
        <div class="grid grid-cols-3 gap-6">

            <!-- Top Left -->
            <div>
                <p class="font-semibold mb-2">Top Left</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-start justify-start p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Top Center -->
            <div>
                <p class="font-semibold mb-2">Top Center</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-start justify-center p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Top Right -->
            <div>
                <p class="font-semibold mb-2">Top Right</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-start justify-end p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Middle Left -->
            <div>
                <p class="font-semibold mb-2">Middle Left</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-center justify-start p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Center -->
            <div>
                <p class="font-semibold mb-2">Center</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-center justify-center p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Middle Right -->
            <div>
                <p class="font-semibold mb-2">Middle Right</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-center justify-end p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Bottom Left -->
            <div>
                <p class="font-semibold mb-2">Bottom Left</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-end justify-start p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Bottom Center -->
            <div>
                <p class="font-semibold mb-2">Bottom Center</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-end justify-center p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>

            <!-- Bottom Right -->
            <div>
                <p class="font-semibold mb-2">Bottom Right</p>
                <div class="flex h-64 border-2 border-gray-400 bg-white items-end justify-end p-2">
                    <div class="size-12 bg-blue-500"></div>
                </div>
            </div>
        </div>
    </section>

    
</body>
</html>
